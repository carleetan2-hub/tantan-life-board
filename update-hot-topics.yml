name: 每日更新爆款话题

on:
  schedule:
    # 每天北京时间 08:30 自动运行（UTC 00:30）
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-hot-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 抓取全平台热点数据
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // DailyHot API 支持的平台列表（多个 API 源作为备选）
            const API_BASES = [
              'https://dailyhot.cmcq.xyz',
              'https://api-hot.imsyy.top',
              'https://api-hot.cricnep.tech'
            ];
            const platforms = [
              { key: 'weibo',       name: '微博热搜' },
              { key: 'zhihu',       name: '知乎热榜' },
              { key: 'douyin',      name: '抖音热搜' },
              { key: 'xiaohongshu', name: '小红书热搜' },
              { key: 'weixin',      name: '微信热搜' },
              { key: 'baidu',       name: '百度热搜' },
              { key: 'bilibili',    name: 'B站热搜' },
              { key: 'toutiao',     name: '今日头条' },
              { key: '36kr',        name: 'AI科技新闻' }
            ];

            function pickList(json) {
              if (Array.isArray(json)) return json;
              if (Array.isArray(json?.data)) return json.data;
              if (Array.isArray(json?.data?.list)) return json.data.list;
              if (Array.isArray(json?.list)) return json.list;
              if (Array.isArray(json?.items)) return json.items;
              return [];
            }

            const output = [];
            const summary = {};

            for (const p of platforms) {
              let success = false;
              for (const API_BASE of API_BASES) {
                try {
                  console.log(`正在抓取 ${p.name} (${API_BASE})...`);
                  const res = await fetch(`${API_BASE}/${p.key}`, {
                    headers: { 'User-Agent': 'Tantan-Life-Board/1.0' },
                    signal: AbortSignal.timeout(15000)
                  });

                  if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                  }

                  const json = await res.json();
                  const list = pickList(json).slice(0, 15);

                  if (list.length === 0) {
                    throw new Error('返回空列表');
                  }

                  console.log(`✅ ${p.name} 抓取到 ${list.length} 条 (来源: ${API_BASE})`);
                  summary[p.key] = { name: p.name, count: list.length };

                  list.forEach((item, index) => {
                    output.push({
                      platform: p.key,
                      title: item.title || item.name || item.word || item.desc || item.keyword || `热点${index + 1}`,
                      url: item.url || item.link || item.mobileUrl || item.href || '',
                      hot: item.hot || item.hotValue || item.index || item.rank || item.desc || item.summary || '',
                      fetchedAt: new Date().toISOString()
                    });
                  });
                  success = true;
                  break;
                } catch (err) {
                  console.error(`  ${API_BASE} 失败: ${err.message}`);
                }
              }
              if (!success) {
                summary[p.key] = { name: p.name, count: 0, error: '所有 API 源均失败' };
              }
            }
              }
            }

            // 输出汇总日志
            console.log('\n========== 抓取汇总 ==========');
            for (const [key, info] of Object.entries(summary)) {
              const status = info.count > 0 ? `✅ ${info.count}条` : `❌ ${info.error || '失败'}`;
              console.log(`${info.name}: ${status}`);
            }
            console.log(`总计: ${output.length} 条热点\n`);

            if (output.length === 0) {
              console.log('⚠️ 所有平台均抓取失败，保留上次的 hot-topics.json');
              return;
            }

            fs.writeFileSync('hot-topics.json', JSON.stringify(output, null, 2), 'utf8');
            console.log('hot-topics.json 已写入');

            // 保存汇总信息到 GitHub Actions 输出
            core.setOutput('total', output.length);

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hot-topics.json
          if git diff --cached --quiet; then
            echo "热点数据无变化，跳过提交"
          else
            git commit -m "自动更新热点数据 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
